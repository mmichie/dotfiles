# picom for the vm-aarch64 guest: soft shadows, rounded corners and fades for
# dwm's windows. The X session starts it (hosts/vm-aarch64/configuration.nix).
#
# The xrender backend, picom's default, draws through the X server's Render
# extension. The guest has no GPU acceleration (UTM's virtio-gpu comes
# without virgl, and its OpenGL is Mesa's llvmpipe, on the CPU), so glx
# would gain nothing.
backend = "xrender";
vsync = false;
use-damage = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.5;
shadow-offset-x = -14;
shadow-offset-y = -10;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;

# also dunst's (configs/dunst/dunstrc) and rofi's (configs/rofi/config.rasi)
corner-radius = 8;

# A window grows into place as it opens, and shrinks away as it closes.
animations = ({
  triggers = [ "open", "show" ];
  preset = "appear";
  scale = 0.95;
  duration = 0.15;
}, {
  triggers = [ "close", "hide" ];
  preset = "disappear";
  scale = 0.95;
  duration = 0.12;
});

rules = ({
  # dwm's bar, and dmenu, which opens over it: square and flat
  match = "class_g = 'dwm' || class_g = 'dmenu'";
  shadow = false;
  corner-radius = 0;
}, {
  # menus and tooltips, Chrome's among them, stay square
  match = "window_type = 'menu' || window_type = 'dropdown_menu' || "
          "window_type = 'popup_menu' || window_type = 'tooltip'";
  corner-radius = 0;
}, {
  # with rules set, picom no longer squares fullscreen windows itself
  match = "fullscreen";
  corner-radius = 0;
});
