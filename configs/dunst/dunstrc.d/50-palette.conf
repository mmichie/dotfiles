# Generated from hosts/vm-aarch64/palette.nix by `just palette`: edit that file, not this one.

[urgency_low]
    background = "#1c1c1c"
    foreground = "#8a8a8a"
    frame_color = "#444444"
    highlight = "#8a8a8a"
    format = "<span background='#444444' foreground='#e4e4e4'> %a </span><span foreground='#444444'>&#xe0b0;</span> <b>%s</b>\n%b"

[urgency_normal]
    background = "#1c1c1c"
    foreground = "#e4e4e4"
    frame_color = "#00afff"
    highlight = "#00afff"
    format = "<span background='#00afff' foreground='#000000'> %a </span><span foreground='#00afff'>&#xe0b0;</span> <b>%s</b>\n%b"

[urgency_critical]
    background = "#1c1c1c"
    foreground = "#e4e4e4"
    frame_color = "#ff0000"
    highlight = "#ff0000"
    format = "<span background='#ff0000' foreground='#000000'> %a </span><span foreground='#ff0000'>&#xe0b0;</span> <b>%s</b>\n%b"
